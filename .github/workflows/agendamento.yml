name: Executar Robo Betano Diariamente

on:
  schedule:
    # Roda todo dia às 10h00 BRT (13h00 UTC)
    - cron: '0 13 * * *'
  workflow_dispatch: # Permite continuar rodando manualmente pelo botão "Run workflow"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      - name: Executar o robô
        env:
          # Certifique-se de que os nomes batem com os Secrets criados no repositório
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python main.py
